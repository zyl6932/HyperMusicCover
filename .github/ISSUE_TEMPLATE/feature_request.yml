name: 💡 功能建议 (Feature Request)
description: 提出新功能、交互改进或性能优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！

        > [!TIP]
        > 本项目优先贴合 HyperOS 原生交互与锁屏体验。
        > 提交前请先在 [Issues](https://github.com/zyl6932/HyperMusicCover/issues) 检索是否已有类似建议。

  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      description: 请选择建议涉及的方向
      options:
        - 🎨 界面与视觉（时钟、卡片、动效、设置页）
        - 🖼️ 封面与壁纸（封面模式、动态封面、壁纸压暗）
        - 📝 歌词（逐字、翻译、来源、样式）
        - 🔔 通知与锁屏岛（岛、胶囊、通知布局）
        - 🚀 性能与底层（渲染、内存、耗电）
        - 💡 其它
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 模块版本
      description: 请填写当前使用的模块版本
      placeholder: 例如：v0.9.47
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 当前在什么场景下体验不佳？为什么需要这个功能？
      placeholder: 请描述使用场景与现有方案的问题...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案设想与交互细节
      description: 希望功能如何呈现？入口在哪？操作流程是什么？
      placeholder: 请尽可能具体地描述期望的交互...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 参考设计或备选方案（可选）
      description: 是否有 HyperOS 原生、ColorOS、KeiMi 或其他项目的成熟设计可参考？
      placeholder: 可附图、链接或设计草图

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认清单
      options:
        - label: 我已检索现有 Issues，确认此前没有相同建议
          required: true
        - label: 我使用的是 nightly 或正式版，并确认该功能尚未实现
          required: true
        - label: 我理解本项目需要兼顾 HyperOS 不同版本的兼容性，实现方式可能调整
          required: true
