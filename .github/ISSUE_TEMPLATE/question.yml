name: 💬 使用咨询 (Question)
description: 关于安装、设置、歌词来源、模块冲突等使用问题
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先对照以下高频问题：

        > [!NOTE]
        > **Q1：装了模块没效果？**
        > A：安装或更新后必须重启系统界面（SystemUI）与 MiWallpaper；并确认 LSPosed 作用域已勾选 SystemUI。
        >
        > **Q2：锁屏不显示封面？**
        > A：封面模式跟随媒体卡。请先确认媒体卡开关已打开，再检查「封面」设置页中选择的模式。
        >
        > **Q3：歌词不显示或不同步？**
        > A：请检查歌词来源设置，以及当前播放器是否在支持范围内。
        >
        > **Q4：和其他模块冲突？**
        > A：请先排除 HyperSystemUIHook 等会打包旧版 MusicCover 的模块。
        >
        > **Q5：怎么提供日志？**
        > A：LSPosed 管理器 → 日志 → 导出；logcat 请复现后立即抓取。
        >
        > **Q6：为什么本地编译的版本很卡？**
        > A：本地 debug 构建性能差是已知现象；nightly 与正式版都是 release 构建，请用它们复测。

  - type: dropdown
    id: category
    attributes:
      label: 咨询类型
      description: 请选择疑问涉及的方面
      options:
        - 📦 安装与更新（LSPosed、作用域、重启生效）
        - ⚙️ 设置与开关（封面模式、岛、胶囊、材质）
        - 📝 歌词与来源（逐字歌词、翻译、播放器支持）
        - 🔔 通知与锁屏岛
        - 🖼️ 壁纸与动态封面
        - ❓ 其它
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 模块版本
      description: 请填写「设置 → 关于」显示的版本号
      placeholder: 例如：v0.9.47
    validations:
      required: true

  - type: input
    id: env_info
    attributes:
      label: 设备与系统（可选）
      placeholder: 例如：小米 15（HyperOS 3.0.304.0 / Android 16）

  - type: textarea
    id: content
    attributes:
      label: 疑问详情
      description: 请清晰描述你的疑问，已尝试过哪些操作
      placeholder: 请在此详细说明...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认清单
      options:
        - label: 我已阅读上方高频问题解答，问题仍无法解决
          required: true
        - label: 我已在 Issues 中搜索过相关讨论
          required: true
