name: CI

# Every push and every pull request gets built. Nothing here publishes anything - the only
# question this workflow answers is "does the tree still compile", which is the one that has to
# be answered before a nightly is worth making.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:

# A newer push makes the older run pointless, so don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Accepts the SDK licences so AGP may fetch compileSdk 37 by itself; the runner image
      # does not ship a platform that new.
      - uses: android-actions/setup-android@v3

      # Restores the Gradle and configuration caches, and writes a build summary.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug
        run: ./gradlew --no-daemon assembleDebug

      # Release is built too, unsigned-but-for-the-debug-key here: the point is that the
      # release variant compiles, so a nightly never fails for a reason CI could have caught.
      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
